<svg width="595.57709mm" height="595.3125mm" viewBox="0 0 595.57708 595.3125" id="svg1" xml:space="preserve" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <style type="text/css"><![CDATA[
      /* 0. Lingkaran Dasar Navy: Ikut menyusut, melebur jadi cincin luar, dan terurai ke Kutub Utara */
      .base-circle {
        fill: #1c283d;
        stroke: #1c283d;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 1000 1020;
        stroke-dashoffset: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: baseCircleAnim 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes baseCircleAnim {
        /* Stabil sebagai fondasi saat elemen dalam sedang mulai terurai */
        0%, 34% {
          fill-opacity: 1;
          stroke: #1c283d;
          stroke-dashoffset: 0;
          stroke-opacity: 1;
          transform: scale(1);
        }
        /* Fill navy meredup, menyisakan garis tepi bercahaya ungu-biru */
        41% {
          fill-opacity: 0.08;
          stroke: #7601ff;
          stroke-dashoffset: 0;
          stroke-opacity: 1;
          transform: scale(0.95);
        }
        /* Tali lingkaran dasar menggulung habis ke Kutub Utara tepat setelah cincin putih */
        48%, 50% {
          fill-opacity: 0;
          stroke: #b73eff;
          stroke-dashoffset: -1005;
          stroke-opacity: 0;
          transform: scale(0.86);
        }
        /* Siap merajut kembali dari arah berlawanan */
        51% {
          fill-opacity: 0;
          stroke: #b73eff;
          stroke-dashoffset: 1005;
          stroke-opacity: 0;
          transform: scale(0.86);
        }
        52% {
          fill-opacity: 0.08;
          stroke: #7601ff;
          stroke-opacity: 1;
        }
        /* Lingkaran dasar melata penuh lebih dulu dengan sedikit efek membal (overshoot) */
        59% {
          fill-opacity: 0.35;
          stroke: #7601ff;
          stroke-dashoffset: 0;
          stroke-opacity: 1;
          transform: scale(1.025);
        }
        /* Kembali solid dan stabil menyambut elemen-elemen di dalamnya */
        65%, 100% {
          fill-opacity: 1;
          stroke: #1c283d;
          stroke-dashoffset: 0;
          stroke-opacity: 1;
          transform: scale(1);
        }
      }

      /* 1. Bola Dunia Ungu: Meredup & menyusut lembut saat tali terurai, memekar saat menyatu */
      .globe-fill {
        transform-box: fill-box;
        transform-origin: center;
        animation: globeFillAnim 7s ease-in-out infinite;
      }
      @keyframes globeFillAnim {
        0%, 14%, 86%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        28%, 72% {
          opacity: 0.1;
          transform: scale(0.88);
        }
        48%, 52% {
          opacity: 0.03;
          transform: scale(0.82);
        }
      }

      /* 2. Tali Cincin Putih Luar (Bagian 1 dari alur tali) */
      .rope-ring {
        stroke-dasharray: 1000 1020;
        stroke-dashoffset: 0;
        animation: ringRopeAnim 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes ringRopeAnim {
        /* Utuh hingga tali LS & Bola Dunia selesai ditarik ke atas */
        0%, 33% {
          stroke-dashoffset: 0;
          stroke-opacity: 1;
        }
        /* Tali cincin menggulung habis dalam 1 tarikan utuh */
        44%, 52% {
          stroke-dashoffset: -1005;
          stroke-opacity: 0;
        }
        /* Siap masuk kembali dari arah berlawanan setelah base circle mulai terbentuk */
        53% {
          stroke-dashoffset: 1005;
          stroke-opacity: 0;
        }
        54% {
          stroke-opacity: 1;
        }
        /* Cincin melata penuh menyusul base circle lalu disambung oleh tali bola dunia */
        65%, 100% {
          stroke-dashoffset: 0;
          stroke-opacity: 1;
        }
      }

      /* 3. Satu Tali Utuh Jaring Bola Dunia (Meliuk zig-zag melewati 7 lintang & 5 bujur tanpa putus) */
      .rope-globe {
        stroke-dasharray: 1000 1020;
        stroke-dashoffset: 0;
        animation: globeRopeAnim 7s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      @keyframes globeRopeAnim {
        /* Utuh hingga tali LS selesai ditarik */
        0%, 22% {
          stroke-dashoffset: 0;
          stroke-opacity: 1;
        }
        /* Terurai dalam 1 tali utuh dari tengah -> elips -> meliuk zig-zag naik ke Kutub Utara */
        36% {
          stroke-dashoffset: 1005;
          stroke-opacity: 1;
        }
        37%, 60% {
          stroke-dashoffset: 1005;
          stroke-opacity: 0;
        }
        /* Menyambung dari cincin luar: masuk dari Kutub Utara, meliuk zig-zag turun -> elips -> tengah */
        61% {
          stroke-dashoffset: 1005;
          stroke-opacity: 1;
        }
        76%, 100% {
          stroke-dashoffset: 0;
          stroke-opacity: 1;
        }
      }

      /* 4. Satu Tali Utuh Emblem LS Putih (Menyambung langsung dengan tali bola dunia) */
      .rope-ls {
        fill: #fefefe;
        stroke: #fefefe;
        stroke-width: 5.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000 1020;
        stroke-dashoffset: 0;
        animation: lsRopeAnim 7s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      @keyframes lsRopeAnim {
        /* Logo utuh (Fill solid aktif) */
        0%, 10% {
          fill-opacity: 1;
          stroke-dashoffset: 0;
          stroke-opacity: 1;
        }
        /* Fill meredup menjadi 1 garis kerangka utuh */
        14% {
          fill-opacity: 0;
          stroke-dashoffset: 0;
          stroke-opacity: 1;
        }
        /* Tali LS ditarik mundur dari S -> L dalam satu garis tanpa putus */
        24% {
          fill-opacity: 0;
          stroke-dashoffset: 1005;
          stroke-opacity: 1;
        }
        25%, 73% {
          fill-opacity: 0;
          stroke-dashoffset: 1005;
          stroke-opacity: 0;
        }
        /* Menyambung dari tali bola dunia: merayap menggambar L -> S dalam satu garis utuh */
        74% {
          fill-opacity: 0;
          stroke-dashoffset: 1005;
          stroke-opacity: 1;
        }
        85% {
          fill-opacity: 0;
          stroke-dashoffset: 0;
          stroke-opacity: 1;
        }
        /* Fill solid putih kembali menyala penuh */
        90%, 100% {
          fill-opacity: 1;
          stroke-dashoffset: 0;
          stroke-opacity: 1;
        }
      }
    ]]></style>
  </defs>

