        <circle id="path1" class="origin-center navy-outer" cx="129.75656" cy="155.31041" r="265.2" pathLength="1000" fill="#1c283d" />

        <!-- 2. Cincin Putih Tipis -->
        <circle class="origin-center white-ring" cx="129.75656" cy="155.31041" r="227.45" pathLength="1000" fill="none" stroke="#fefefe" stroke-width="6.5" />

        <!-- 3. Background Bola Dunia Ungu -->
        <circle class="origin-center purple-globe" cx="129.75656" cy="155.31041" r="172.58" pathLength="1000" fill="url(#purple-globe-gradient-tune)" />

