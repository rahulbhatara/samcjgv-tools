          <!-- Garis Bujur Tengah & Elips Meridian -->
          <line class="origin-center lon-ellipse d2" pathLength="100" x1="129.75656" y1="-5.26959" x2="129.75656" y2="315.89041" />
          <ellipse class="origin-center lon-ellipse d1" pathLength="100" cx="129.75656" cy="155.31041" rx="49.7798" ry="160.5800" />
