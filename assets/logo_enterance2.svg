          <ellipse class="origin-center lon-ellipse rev d7" pathLength="100" cx="129.75656" cy="155.31041" rx="147.7336" ry="160.5800" />
        </g>

        <!-- Cincin Batas Luar Grid Bola Dunia -->
        <circle class="origin-center lon-ellipse rev d4" pathLength="100" cx="129.75656" cy="155.31041" r="160.58" fill="none" stroke="#cc90fd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

        <!-- 5. Emblem LS Putih (Dibagi 2 bagian agar berpisah ke arah berlawanan seperti ular) -->
        <!-- Bagian Kanan (S) -->
