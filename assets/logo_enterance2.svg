<svg width="595.57709mm" height="595.3125mm" viewBox="0 0 595.57708 595.3125" id="svg1" xml:space="preserve" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <style type="text/css"><![CDATA[
      /* Pusat rotasi dan transformasi di titik tengah logo di dalam grup g5 */
      .origin-center {
        transform-box: view-box;
        transform-origin: 129.75656px 155.31041px;
      }

      /* 1. Lingkaran Luar Navy: Berubah jadi ular melingkar lalu menyatu */
      .navy-outer {
        stroke: #1c283d;
        stroke-linecap: round;
        animation: navySnake 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      @keyframes navySnake {
        0%, 15%, 85%, 100% {
          fill-opacity: 1;
          stroke-width: 0;
          stroke-dasharray: 1000 0;
          stroke-dashoffset: 0;
          transform: rotate(0deg) scale(1);
        }
        30% {
          fill-opacity: 0;
          stroke-width: 28;
          stroke-dasharray: 350 650;
          stroke-dashoffset: -150;
          transform: rotate(90deg) scale(1.04);
        }
        50% {
          fill-opacity: 0;
          stroke-width: 22;
          stroke-dasharray: 180 320 180 320;
          stroke-dashoffset: -500;
          transform: rotate(220deg) scale(0.92);
        }
        70% {
          fill-opacity: 0;
          stroke-width: 28;
          stroke-dasharray: 450 550;
          stroke-dashoffset: -850;
          transform: rotate(360deg) scale(1.02);
        }
      }

      /* 2. Cincin Putih Tipis: Memecah & melata seperti ular mengelilingi orbit */
      .white-ring {
        stroke-linecap: round;
        animation: ringSnake 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      @keyframes ringSnake {
        0%, 12%, 88%, 100% {
          stroke-dasharray: 1000 0;
          stroke-dashoffset: 0;
          stroke-width: 6.5;
          transform: rotate(0deg) scale(1);
        }
        35% {
          stroke-dasharray: 220 280 220 280;
          stroke-dashoffset: 350;
          stroke-width: 10;
          transform: rotate(-120deg) scale(1.08) skewX(6deg);
        }
        55% {
          stroke-dasharray: 120 380 120 380;
          stroke-dashoffset: 700;
          stroke-width: 8;
          transform: rotate(-240deg) scale(0.86) skewY(-6deg);
        }
        75% {
          stroke-dasharray: 400 100 400 100;
          stroke-dashoffset: 1000;
          stroke-width: 7;
          transform: rotate(-360deg) scale(1.02);
        }
      }

      /* 3. Bola Dunia Ungu (Background): Mengelupas seperti pita/ular melingkar */
      .purple-globe {
        stroke: url(#purple-globe-gradient-tune);
        stroke-linecap: round;
        animation: globeSnake 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      @keyframes globeSnake {
        0%, 15%, 85%, 100% {
          fill-opacity: 1;
          stroke-width: 0;
          stroke-dasharray: 1000 0;
          stroke-dashoffset: 0;
          transform: rotate(0deg) scale(1);
        }
        35% {
          fill-opacity: 0;
          stroke-width: 45;
          stroke-dasharray: 300 700;
          stroke-dashoffset: -200;
          transform: rotate(-90deg) scale(0.9);
        }
        50% {
          fill-opacity: 0;
          stroke-width: 35;
          stroke-dasharray: 200 300 200 300;
          stroke-dashoffset: -550;
          transform: rotate(-180deg) scale(1.08);
        }
        70% {
          fill-opacity: 0.3;
          stroke-width: 45;
          stroke-dasharray: 600 400;
          stroke-dashoffset: -900;
          transform: rotate(-360deg) scale(0.96);
        }
      }

      /* 4. Garis Lintang (Horizontal Grid): Melata ke kiri/kanan dengan liukan gelombang */
      .lat-line {
        animation: latSnakeRight 6s ease-in-out infinite;
      }
      .lat-line.alt {
        animation-name: latSnakeLeft;
      }
      .d1 { animation-delay: 0.00s; }
      .d2 { animation-delay: 0.08s; }
      .d3 { animation-delay: 0.16s; }
      .d4 { animation-delay: 0.24s; }
      .d5 { animation-delay: 0.32s; }
      .d6 { animation-delay: 0.40s; }
      .d7 { animation-delay: 0.48s; }

      @keyframes latSnakeRight {
        0%, 14%, 86%, 100% {
          stroke-dasharray: 100 0;
          stroke-dashoffset: 0;
          transform: translate(0, 0) rotate(0deg);
          opacity: 0.95;
        }
        32% {
          stroke-dasharray: 35 65;
          stroke-dashoffset: -30;
          transform: translate(85px, -18px) rotate(12deg);
        }
        48% {
          stroke-dasharray: 25 75;
          stroke-dashoffset: -75;
          transform: translate(140px, 22px) rotate(-14deg);
        }
        64% {
          stroke-dasharray: 40 60;
          stroke-dashoffset: -120;
          transform: translate(-60px, -12px) rotate(8deg);
        }
      }

      @keyframes latSnakeLeft {
        0%, 14%, 86%, 100% {
          stroke-dasharray: 100 0;
          stroke-dashoffset: 0;
          transform: translate(0, 0) rotate(0deg);
          opacity: 0.95;
        }
        32% {
          stroke-dasharray: 35 65;
          stroke-dashoffset: 30;
          transform: translate(-85px, 18px) rotate(-12deg);
        }
        48% {
          stroke-dasharray: 25 75;
          stroke-dashoffset: 75;
          transform: translate(-140px, -22px) rotate(14deg);
        }
        64% {
          stroke-dasharray: 40 60;
          stroke-dashoffset: 120;
          transform: translate(60px, 12px) rotate(-8deg);
        }
      }

      /* 5. Garis Bujur & Elips Meridian: Melata memutar sepanjang lintasan elips */
      .lon-ellipse {
        animation: ellipseSnake 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .lon-ellipse.rev {
        animation-name: ellipseSnakeRev;
      }
      @keyframes ellipseSnake {
        0%, 14%, 86%, 100% {
          stroke-dasharray: 100 0;
          stroke-dashoffset: 0;
          transform: rotate(0deg) scale(1);
        }
        35% {
          stroke-dasharray: 28 72;
          stroke-dashoffset: -40;
          transform: rotate(65deg) scale(1.18, 0.88);
        }
        55% {
          stroke-dasharray: 20 30 20 30;
          stroke-dashoffset: -95;
          transform: rotate(180deg) scale(0.85, 1.15);
        }
        72% {
          stroke-dasharray: 55 45;
          stroke-dashoffset: -150;
          transform: rotate(360deg) scale(1.05);
        }
      }
      @keyframes ellipseSnakeRev {
        0%, 14%, 86%, 100% {
          stroke-dasharray: 100 0;
          stroke-dashoffset: 0;
          transform: rotate(0deg) scale(1);
        }
        35% {
          stroke-dasharray: 28 72;
          stroke-dashoffset: 40;
          transform: rotate(-75deg) scale(0.88, 1.18);
        }
        55% {
          stroke-dasharray: 20 30 20 30;
          stroke-dashoffset: 95;
          transform: rotate(-190deg) scale(1.15, 0.85);
        }
        72% {
          stroke-dasharray: 55 45;
          stroke-dashoffset: 150;
          transform: rotate(-360deg) scale(1.05);
        }
      }

      /* 6. Emblem LS Putih (Kiri & Kanan): Meliuk zig-zag seperti 2 ular lalu bergabung */
      .ls-part-right {
        fill: #fefefe;
        stroke: #fefefe;
        stroke-linejoin: round;
        stroke-linecap: round;
        animation: lsSnakeRight 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .ls-part-left {
        fill: #fefefe;
        stroke: #fefefe;
        stroke-linejoin: round;
        stroke-linecap: round;
        animation: lsSnakeLeft 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      @keyframes lsSnakeRight {
        0%, 16%, 84%, 100% {
          fill-opacity: 1;
          stroke-width: 0;
          stroke-dasharray: 1000 0;
          stroke-dashoffset: 0;
          transform: translate(0, 0) rotate(0deg) skewY(0deg);
        }
        28% {
          fill-opacity: 0;
          stroke-width: 8;
          stroke-dasharray: 320 680;
          stroke-dashoffset: -120;
          transform: translate(45px, -35px) rotate(15deg) skewY(12deg);
        }
        44% {
          fill-opacity: 0;
          stroke-width: 10;
          stroke-dasharray: 220 780;
          stroke-dashoffset: -420;
          transform: translate(115px, 30px) rotate(-18deg) skewY(-15deg);
        }
        60% {
          fill-opacity: 0;
          stroke-width: 9;
          stroke-dasharray: 300 700;
          stroke-dashoffset: -720;
          transform: translate(55px, 65px) rotate(14deg) skewY(10deg);
        }
        74% {
          fill-opacity: 0.25;
          stroke-width: 6;
          stroke-dasharray: 850 150;
          stroke-dashoffset: -960;
          transform: translate(-10px, -12px) rotate(-4deg) skewY(-3deg);
        }
      }

      @keyframes lsSnakeLeft {
        0%, 16%, 84%, 100% {
          fill-opacity: 1;
          stroke-width: 0;
          stroke-dasharray: 1000 0;
          stroke-dashoffset: 0;
          transform: translate(0, 0) rotate(0deg) skewY(0deg);
        }
        28% {
          fill-opacity: 0;
          stroke-width: 8;
          stroke-dasharray: 320 680;
          stroke-dashoffset: 120;
          transform: translate(-45px, 35px) rotate(-15deg) skewY(-12deg);
        }
        44% {
          fill-opacity: 0;
          stroke-width: 10;
          stroke-dasharray: 220 780;
          stroke-dashoffset: 420;
          transform: translate(-115px, -30px) rotate(18deg) skewY(15deg);
        }
        60% {
          fill-opacity: 0;
          stroke-width: 9;
          stroke-dasharray: 300 700;
          stroke-dashoffset: 720;
          transform: translate(-55px, -65px) rotate(-14deg) skewY(-10deg);
        }
        74% {
          fill-opacity: 0.25;
          stroke-width: 6;
          stroke-dasharray: 850 150;
          stroke-dashoffset: 960;
          transform: translate(10px, 12px) rotate(4deg) skewY(3deg);
        }
      }
    ]]></style>
  </defs>

  <g id="layer1" transform="translate(-573.12394,-99.46362)">
