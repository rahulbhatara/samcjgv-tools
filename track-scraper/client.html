<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SAMC Track Scraper CEF Bridge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Headless CEF Bridge: UI and controls are managed from Dashboard -->
    <script>
        // ============================================
        //  CONFIG & STATE
        // ============================================
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_URL = `${protocol}//${location.host}/ws`;
        let ws = null;
        let reconnectTimer = null;

        // ============================================
        //  WEBSOCKET CONNECTION
        // ============================================
        function connectWS() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log("[CEF Bridge] Connected to WebSocket server");
                // Register as CEF client
                ws.send(JSON.stringify({ type: 'register', role: 'cef' }));
            };

            ws.onmessage = (event) => {
                // Future commands from dashboard if needed
            };

            ws.onclose = () => {
                scheduleReconnect();
            };

            ws.onerror = () => { };
        }

        function scheduleReconnect() {
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(connectWS, 2000);
        }

        function wsSend(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(msg));
            }
        }

        // ============================================
        //  DATA PROCESSOR
        // ============================================
        function processScoreboardData(data) {
            try {
                let parsed = data;
                if (typeof data === 'string') {
                    parsed = JSON.parse(data);
                }

                // Extract position from first entry if available
                let pos = null;
                if (Array.isArray(parsed) && parsed.length > 0 && parsed[0] && parsed[0].position) {
                    pos = parsed[0].position;
                } else if (parsed && parsed.position) {
                    pos = parsed.position;
                }

                // Always send raw data & extracted position to server
                wsSend({
                    type: 'cef_data',
                    raw: parsed,
                    pos: pos
                });
            } catch (err) {
                console.error("[CEF Bridge] Error parsing data:", err);
            }
        }

        // ============================================
        //  GAME API HOOKS (RaceRoom / FiveM / GTA V)
        // ============================================
        window.updateScoreboard = function (jsonStr) {
            processScoreboardData(jsonStr);
        };

        window.setLap = function (data) {
            try {
                let parsed = (typeof data === 'string') ? JSON.parse(data) : data;
                wsSend({
                    type: 'cef_data',
                    raw: { event: 'setLap', data: parsed }
                });
            } catch (e) {
                wsSend({
                    type: 'cef_data',
                    raw: { event: 'setLap', data: data }
                });
            }
        };

        window.setTime = function (seconds) {
            // Optional time tracker
        };

        // postMessage fallback support
        window.addEventListener('message', function (e) {
            try {
                const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
                if (!d) return;
                if (d.functionName === 'updateScoreboard') processScoreboardData(d.arguments[0]);
                if (d.functionName === 'setLap') window.setLap(d.arguments[0]);
            } catch (e) { }
        });

        // Initialize
        connectWS();
    </script>
</body>
</html>
